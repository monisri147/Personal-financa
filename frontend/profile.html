<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow - Profile</title>
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-layout">

        <!-- ================= SIDEBAR NAVIGATION ================= -->
        <aside class="sidebar">
            <div class="brand">💰 FinanceFlow</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">🏠 Dashboard</a>
                <a href="transactions.html">💳 Transactions</a>
                <a href="budget.html">💰 Budget</a>
                <a href="analytics.html">📊 Analytics</a>
                <a href="profile.html" class="active">👤 Profile</a>
            </nav>
            <div class="logout-section">
                <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
            </div>
        </aside>

        <!-- ================= MOBILE HEADER ================= -->
        <header class="mobile-header">
            <div class="logo">💰 FinanceFlow</div>
            <button id="sidebarToggle" class="menu-btn">☰</button>
        </header>

        <!-- ================= MAIN CONTENT AREA ================= -->
        <main class="main-content">

            <!-- Title -->
            <div class="welcome-section">
                <div>
                    <h1>My Profile</h1>
                    <p>Manage your account settings and credentials.</p>
                </div>
            </div>

            <!-- ================= PROFILE CARD ================= -->
            <section class="card profile-card">
                
                <div class="profile-avatar">
                    👤
                </div>

                <h2 id="profileName">User</h2>
                <p id="profileEmail">user@example.com</p>

                <!-- Profile details -->
                <div class="profile-details">
                    
                    <div class="profile-detail">
                        <span>Display Name</span>
                        <strong id="profileNameDetail">-</strong>
                    </div>

                    <div class="profile-detail">
                        <span>Email Address</span>
                        <strong id="profileEmailDetail">-</strong>
                    </div>

                    <div class="profile-detail">
                        <span>Account Type</span>
                        <strong>Personal Finance</strong>
                    </div>

                </div>

                <!-- Edit Profile Form -->
                <form id="editProfileForm" style="width: 100%; margin-bottom: 24px;">
                    <div style="margin-bottom: 12px;">
                        <label for="editNameInput" style="font-size: 13px; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 6px;">Update Full Name</label>
                        <input type="text" id="editNameInput" placeholder="Enter new full name" required style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px;">
                    </div>
                    <button type="submit" class="btn" style="width: 100%; padding: 10px; font-size: 14px;">Save Profile Changes</button>
                    <p id="profileMessage" style="font-size: 13px; margin-top: 8px; text-align: center; display: none;"></p>
                </form>

                <!-- Action Button -->
                <button id="profileLogoutBtn" class="logout-profile-btn">
                    Logout
                </button>
            </section>

        </main>

    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script type="module" src="js/profile.js"></script>

    <!-- Mobile Sidebar Toggle -->
    <script>
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.getElementById('sidebarToggle');
        if (toggle && sidebar) {
            toggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
            });
        }
    </script>

</body>

</html>
