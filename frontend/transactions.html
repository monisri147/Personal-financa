<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - FinanceFlow</title>
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-layout">

        <!-- ================= SIDEBAR NAVIGATION ================= -->
        <aside class="sidebar">
            <div class="brand">💰 FinanceFlow</div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">🏠 Dashboard</a>
                <a href="transactions.html" class="active">💳 Transactions</a>
                <a href="budget.html">💰 Budget</a>
                <a href="analytics.html">📊 Analytics</a>
                <a href="profile.html">👤 Profile</a>
            </nav>
            <div class="logout-section">
                <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
            </div>
        </aside>

        <!-- ================= MOBILE HEADER ================= -->
        <header class="mobile-header">
            <div class="logo">💰 FinanceFlow</div>
            <button id="sidebarToggle" class="menu-btn">☰</button>
        </header>

        <!-- ================= MAIN CONTENT AREA ================= -->
        <main class="main-content">

            <!-- Title Section -->
            <div class="welcome-section">
                <div>
                    <h1>Transactions</h1>
                    <p>Manage your income and expenses.</p>
                </div>
            </div>

            <!-- ================= ADD TRANSACTION ================= -->
            <section class="card" style="margin-bottom: 32px;">
                <h2>Add Transaction</h2>
                
                <form id="transactionForm" style="margin-top: 16px;">
                    <div class="form-grid">
                        
                        <!-- Amount -->
                        <div>
                            <label for="amount">Amount</label>
                            <input
                                type="number"
                                id="amount"
                                placeholder="Enter amount"
                                min="1"
                                required>
                        </div>

                        <!-- Category -->
                        <div>
                            <label for="category">Category</label>
                            <select id="category" required>
                                <option value="">Select Category</option>
                                <option value="Food">Food</option>
                                <option value="Rent">Rent</option>
                                <option value="Transport">Transport</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Education">Education</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Salary">Salary</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <!-- Type -->
                        <div>
                            <label for="type">Transaction Type</label>
                            <select id="type" required>
                                <option value="">Select Type</option>
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>

                        <!-- Date -->
                        <div>
                            <label for="date">Date</label>
                            <input
                                type="date"
                                id="date"
                                required>
                        </div>

                        <!-- Description -->
                        <div>
                            <label for="description">Description</label>
                            <input
                                type="text"
                                id="description"
                                placeholder="Enter description"
                                required>
                        </div>

                    </div>

                    <button type="submit" class="btn" style="margin-top: 10px;">
                        + Add Transaction
                    </button>
                </form>
            </section>

            <!-- ================= TRANSACTION HISTORY ================= -->
            <section class="card">
                <h2>Transaction History</h2>

                <!-- Filters -->
                <div class="filters" style="margin-top: 16px;">
                    <div>
                        <label for="filterCategory">Filter by Category</label>
                        <select id="filterCategory">
                            <option value="all">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Rent">Rent</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Salary">Salary</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label for="filterDate">Filter by Date</label>
                        <input
                            type="date"
                            id="filterDate">
                    </div>
                </div>

                <!-- Responsive Table -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description</th>
                                <th>Category</th>
                                <th>Type</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="transactionList">
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>

    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script type="module" src="js/app.js"></script>

    <!-- Mobile Sidebar Toggle -->
    <script>
        const sidebar = document.querySelector('.sidebar');
        const toggle = document.getElementById('sidebarToggle');
        if (toggle && sidebar) {
            toggle.addEventListener('click', () => {
                sidebar.classList.toggle('active');
            });
        }
    </script>

</body>

</html>
